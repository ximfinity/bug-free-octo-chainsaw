name: Test & Export

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --headless --version

      - name: Import project
        run: godot --headless --import 2>&1 | tee import.log

      - name: Unit tests (world generation, inventory, exploration)
        run: |
          godot --headless -s tests/run_tests.gd 2>&1 | tee unit.log
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load" unit.log

      - name: Smoke test (boots the game and plays the core loop)
        run: |
          timeout 300 godot --headless res://tests/smoke_test.tscn 2>&1 | tee smoke.log
          grep -q "SMOKE TEST: PASS" smoke.log
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load" smoke.log

      - name: Style screenshots (real renderer under Xvfb)
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils > /dev/null
          mkdir -p screenshots
          SHOT_DIR="$PWD/screenshots" timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" \
            godot --rendering-driver opengl3 --resolution 1280x720 res://tests/screenshot.tscn 2>&1 | tee shots.log
          ls -la screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots

      - name: Install export templates
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Export builds
        run: |
          mkdir -p build/windows build/linux build/macos build/web
          godot --headless --export-release "Windows Desktop" build/windows/PaddleAndPine.exe
          godot --headless --export-release "Linux" build/linux/PaddleAndPine.x86_64
          godot --headless --export-release "macOS" build/macos/PaddleAndPine.zip
          godot --headless --export-release "Web" build/web/index.html
          ls -R build

      - uses: actions/upload-artifact@v4
        with:
          name: paddle-and-pine-windows
          path: build/windows
      - uses: actions/upload-artifact@v4
        with:
          name: paddle-and-pine-linux
          path: build/linux
      - uses: actions/upload-artifact@v4
        with:
          name: paddle-and-pine-macos
          path: build/macos
      - uses: actions/upload-artifact@v4
        with:
          name: paddle-and-pine-web
          path: build/web
